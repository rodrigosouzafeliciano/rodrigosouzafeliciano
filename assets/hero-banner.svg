<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Rodrigo Souza Feliciano, Full Stack Software Developer and QA Analyst</title>
  <desc id="desc">Open to remote roles. Laguna, Brazil (UTC-3). Portuguese native, English B2+.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1A2F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

    /* Entrance: base state is fully visible, so the banner stays readable when motion is off. */
    .in { animation: rise 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
    .d1 { animation-delay: 0.10s; } .d2 { animation-delay: 0.22s; }
    .d3 { animation-delay: 0.34s; } .d4 { animation-delay: 0.46s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Terminal: 12 s loop. Command types, checks appear one by one, then everything resets. */
    .cover  { transform: translateX(133px); animation: type 12s infinite; }
    .cursor { transform: translateX(133px); animation: type 12s infinite; }
    @keyframes type {
      0%, 5%  { transform: translateX(0); animation-timing-function: steps(17, end); }
      17%     { transform: translateX(133px); animation-timing-function: linear; }
      93%     { transform: translateX(133px); animation-timing-function: steps(17, end); }
      99%, 100% { transform: translateX(0); }
    }
    .blink { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .o1 { animation: o1 12s infinite; } .o2 { animation: o2 12s infinite; }
    .o3 { animation: o3 12s infinite; } .o4 { animation: o4 12s infinite; }
    .o5 { animation: o5 12s infinite; }
    @keyframes o1 { 0%, 20%   { opacity: 0; transform: translateY(4px); } 23%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
    @keyframes o2 { 0%, 27%   { opacity: 0; transform: translateY(4px); } 30%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
    @keyframes o3 { 0%, 34%   { opacity: 0; transform: translateY(4px); } 37%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
    @keyframes o4 { 0%, 41%   { opacity: 0; transform: translateY(4px); } 44%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
    @keyframes o5 { 0%, 50%   { opacity: 0; transform: translateY(4px); } 54%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="700" height="340" rx="16" fill="url(#dots)" opacity="0.7"/>
  <circle cx="958" cy="170" r="260" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="#1E293B"/>

  <!-- Left: identity -->
  <g class="in">
    <rect x="64" y="58" width="276" height="28" rx="14" fill="#0F172A" stroke="#1E3A4C"/>
    <circle cx="82" cy="72" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="72" r="4" fill="none" stroke="#22C55E" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="96" y="76.5" class="mono" font-size="12" letter-spacing="1" fill="#CBD5E1">OPEN TO REMOTE ROLES · UTC-3</text>
  </g>

  <text x="62" y="148" class="sans in d1" font-size="46" font-weight="700" fill="#F8FAFC">Rodrigo Souza Feliciano</text>
  <text x="64" y="186" class="sans in d2" font-size="21" font-weight="600" fill="#38BDF8">Full Stack Software Developer · QA Analyst</text>

  <g class="sans in d3" font-size="16" fill="#94A3B8">
    <text x="64" y="226">I build web, mobile and real-time systems with React,</text>
    <text x="64" y="250">Next.js, Node.js and PostgreSQL, with a QA mindset.</text>
  </g>

  <text x="64" y="292" class="mono in d4" font-size="12" letter-spacing="0.5" fill="#64748B">Laguna, Brazil · Portuguese (native) · English (B2+)</text>

  <!-- Right: release terminal -->
  <g class="in d2">
    <rect x="780" y="44" width="356" height="252" rx="12" fill="#070D18" stroke="#1E293B"/>
    <path d="M780 56 a12 12 0 0 1 12 -12 h332 a12 12 0 0 1 12 12 v18 h-356 z" fill="#0F172A"/>
    <line x1="780" y1="74" x2="1136" y2="74" stroke="#1E293B"/>
    <circle cx="800" cy="59" r="5" fill="#F87171"/>
    <circle cx="817" cy="59" r="5" fill="#FBBF24"/>
    <circle cx="834" cy="59" r="5" fill="#34D399"/>
    <text x="958" y="63" text-anchor="middle" class="mono" font-size="11" fill="#64748B">~/rodrigo</text>

    <!-- Command line with typing effect -->
    <text x="804" y="108" class="mono" font-size="13" fill="#38BDF8">$</text>
    <text x="820" y="108" class="mono" font-size="13" fill="#E2E8F0" textLength="133" lengthAdjust="spacing">npm run release</text>
    <rect class="cover" x="820" y="94" width="134" height="20" fill="#070D18"/>
    <g class="cursor"><rect class="blink" x="821" y="96" width="7" height="15" fill="#38BDF8"/></g>

    <!-- Output lines -->
    <g class="o1"><g transform="translate(806 128)">
      <path d="M0 6 l3.5 3.5 l7 -8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="10" class="mono" font-size="13" fill="#CBD5E1">lint and type check</text>
    </g></g>
    <g class="o2"><g transform="translate(806 152)">
      <path d="M0 6 l3.5 3.5 l7 -8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="10" class="mono" font-size="13" fill="#CBD5E1">unit and integration tests</text>
    </g></g>
    <g class="o3"><g transform="translate(806 176)">
      <path d="M0 6 l3.5 3.5 l7 -8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="10" class="mono" font-size="13" fill="#CBD5E1">regression suite</text>
    </g></g>
    <g class="o4"><g transform="translate(806 200)">
      <path d="M0 6 l3.5 3.5 l7 -8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="10" class="mono" font-size="13" fill="#CBD5E1">docker image built</text>
    </g></g>
    <g class="o5"><g transform="translate(806 236)">
      <rect x="-6" y="-8" width="320" height="30" rx="6" fill="#0C2233" stroke="#1E3A4C"/>
      <text x="6" y="12" class="mono" font-size="13" fill="#38BDF8">→</text>
      <text x="26" y="12" class="mono" font-size="13" fill="#E2E8F0">shipped to production</text>
    </g></g>
  </g>
</svg>
