<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-label="Rodrigo Souza Feliciano - Full Stack Software Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.06); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatDelayed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(5px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -48; }
      }
      @keyframes statusPulse {
        0%, 100% { r: 4.5px; opacity: 1; }
        50% { r: 6.5px; opacity: 0.55; }
      }

      .glow-orb-1 { animation: pulseGlow 7s ease-in-out infinite; transform-origin: 240px 160px; }
      .glow-orb-2 { animation: pulseGlow 9s ease-in-out infinite; transform-origin: 960px 180px; }
      .radar-ring { animation: radarSweep 14s linear infinite; transform-origin: 980px 180px; }
      .cursor { animation: blinkCursor 1.1s steps(2) infinite; }
      .float-1 { animation: floatSlow 5s ease-in-out infinite; }
      .float-2 { animation: floatDelayed 6s ease-in-out infinite; }
      .data-line { stroke-dasharray: 6 6; animation: dashFlow 2.2s linear infinite; }
      .live-dot { animation: statusPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle class="glow-orb-1" cx="240" cy="160" r="240" fill="url(#glowCyan)"/>
  <circle class="glow-orb-2" cx="960" cy="180" r="220" fill="url(#glowEmerald)"/>

  <!-- Outer Frame Border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#cyanAccent)"/>

  <!-- Top Telemetry Bar -->
  <g transform="translate(48, 28)">
    <rect x="0" y="0" width="290" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle class="live-dot" cx="16" cy="14" r="4.5" fill="#10B981"/>
    <text x="30" y="18" class="font-mono" font-size="11.5" fill="#94A3B8" letter-spacing="0.6">AVAILABLE FOR REMOTE WORK · UTC-3</text>

    <rect x="304" y="0" width="186" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="320" y="18" class="font-mono" font-size="11.5" fill="#38BDF8" letter-spacing="0.5">EN-US / PT-BR BILINGUAL</text>
  </g>

  <!-- Left Column: Identity & Value Proposition -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" class="font-mono" font-size="13" fill="#38BDF8" letter-spacing="1.8" font-weight="600">
      $ whoami --role="full-stack-engineer"
    </text>

    <text x="0" y="48" class="font-sans" font-size="42" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">
      Rodrigo Souza Feliciano
    </text>

    <text x="0" y="84" class="font-sans" font-size="19" font-weight="600" fill="url(#cyanAccent)">
      Full Stack Software Developer · Clean Architecture &amp; QA Engineering
    </text>

    <text x="0" y="118" class="font-sans" font-size="14.5" fill="#94A3B8">
      Building production web &amp; mobile applications, real-time telemetry backends, and zero-defect releases.
    </text>
    <text x="0" y="140" class="font-sans" font-size="14.5" fill="#64748B">
      Desenvolvedor Full Stack focado em sistemas escaláveis, arquitetura limpa, tempo real e qualidade de software.
    </text>

    <!-- Key Stack Pills -->
    <g transform="translate(0, 168)">
      <g transform="translate(0, 0)">
        <rect width="102" height="30" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="51" y="19" text-anchor="middle" class="font-mono" font-size="12" fill="#E2E8F0" font-weight="600">TypeScript</text>
      </g>
      <g transform="translate(112, 0)">
        <rect width="124" height="30" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="62" y="19" text-anchor="middle" class="font-mono" font-size="12" fill="#E2E8F0" font-weight="600">React / Next.js</text>
      </g>
      <g transform="translate(246, 0)">
        <rect width="118" height="30" rx="6" fill="#0F172A" stroke="#34D399" stroke-opacity="0.45"/>
        <text x="59" y="19" text-anchor="middle" class="font-mono" font-size="12" fill="#E2E8F0" font-weight="600">Node.js / Koa</text>
      </g>
      <g transform="translate(374, 0)">
        <rect width="106" height="30" rx="6" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.45"/>
        <text x="53" y="19" text-anchor="middle" class="font-mono" font-size="12" fill="#E2E8F0" font-weight="600">PostgreSQL</text>
      </g>
      <g transform="translate(490, 0)">
        <rect width="128" height="30" rx="6" fill="#0F172A" stroke="#F43F5E" stroke-opacity="0.45"/>
        <text x="64" y="19" text-anchor="middle" class="font-mono" font-size="12" fill="#E2E8F0" font-weight="600">Redis + WS</text>
      </g>
      <g transform="translate(628, 0)">
        <rect width="92" height="30" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="46" y="19" text-anchor="middle" class="font-mono" font-size="12" fill="#E2E8F0" font-weight="600">Docker</text>
      </g>
    </g>

    <!-- Bottom Terminal Prompt -->
    <g transform="translate(0, 224)">
      <text x="0" y="0" class="font-mono" font-size="12.5" fill="#10B981">rodrigo@workstation:~/engineering$</text>
      <text x="255" y="0" class="font-mono" font-size="12.5" fill="#E2E8F0">ship --clean-arch --zero-defect-qa --target=production</text>
      <rect class="cursor" x="668" y="-11" width="8" height="14" fill="#38BDF8"/>
    </g>
  </g>

  <!-- Right Column: Animated Telemetry & Architecture HUD -->
  <g transform="translate(980, 180)">
    <!-- Outer Radar Rings -->
    <circle cx="0" cy="0" r="126" fill="none" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Rotating Radar Sweep -->
    <g class="radar-ring">
      <path d="M 0 0 L 126 0 A 126 126 0 0 1 89 89 Z" fill="url(#glowCyan)" opacity="0.5"/>
      <line x1="0" y1="0" x2="126" y2="0" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
    </g>

    <!-- Connecting Animated Data Lines -->
    <line class="data-line" x1="-95" y1="-65" x2="0" y2="0" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <line class="data-line" x1="82" y1="-72" x2="0" y2="0" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.6"/>
    <line class="data-line" x1="-88" y1="74" x2="0" y2="0" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <line class="data-line" x1="78" y1="78" x2="0" y2="0" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- Center Core Node -->
    <circle cx="0" cy="0" r="28" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#F8FAFC">CLEAN</text>
    <text x="0" y="9" text-anchor="middle" class="font-mono" font-size="9" font-weight="600" fill="#38BDF8">ARCH</text>

    <!-- Floating Telemetry Badges -->
    <g class="float-1" transform="translate(-155, -96)">
      <rect width="124" height="44" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="12" y="18" class="font-mono" font-size="10" fill="#38BDF8" font-weight="700">REST API + WS</text>
      <text x="12" y="34" class="font-sans" font-size="11" fill="#E2E8F0">23+ Routes · Live</text>
    </g>

    <g class="float-2" transform="translate(36, -104)">
      <rect width="128" height="44" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
      <text x="12" y="18" class="font-mono" font-size="10" fill="#10B981" font-weight="700">QA &amp; RELIABILITY</text>
      <text x="12" y="34" class="font-sans" font-size="11" fill="#E2E8F0">Zero-Defect Gate</text>
    </g>

    <g class="float-2" transform="translate(-158, 58)">
      <rect width="128" height="44" rx="8" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="12" y="18" class="font-mono" font-size="10" fill="#818CF8" font-weight="700">DATA &amp; CACHE</text>
      <text x="12" y="34" class="font-sans" font-size="11" fill="#E2E8F0">Postgres + Redis</text>
    </g>

    <g class="float-1" transform="translate(34, 62)">
      <rect width="132" height="44" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
      <text x="12" y="18" class="font-mono" font-size="10" fill="#F59E0B" font-weight="700">OBSERVABILITY</text>
      <text x="12" y="34" class="font-sans" font-size="11" fill="#E2E8F0">Docker + Grafana</text>
    </g>
  </g>
</svg>
