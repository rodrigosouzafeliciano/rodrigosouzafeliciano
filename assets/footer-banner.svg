<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="100%" height="100%" role="img" aria-label="Footer Banner">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
    </linearGradient>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      @keyframes pulseBar {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .glow-line { animation: pulseBar 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="100" rx="12" fill="url(#footerBg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect class="glow-line" x="100" y="0" width="1000" height="2" fill="url(#accentLine)"/>

  <text x="600" y="42" text-anchor="middle" class="font-sans" font-size="15" font-weight="700" fill="#F8FAFC">
    Open to 100% Remote Software Engineering Opportunities (Brazil &amp; International)
  </text>
  <text x="600" y="66" text-anchor="middle" class="font-mono" font-size="12" fill="#38BDF8">
    Disponível para oportunidades 100% remotas no Brasil e no exterior · Laguna, SC, Brazil (UTC-3)
  </text>
</svg>
